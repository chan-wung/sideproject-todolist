name: CI

# 푸시와 풀 리퀘스트마다 린트 · 테스트 · 빌드를 돌린다. 배포나 비밀키는 쓰지 않는다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json 기준으로 설치한다 (lock과 package.json이 어긋나 있으면 여기서 실패한다)
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
